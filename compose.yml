services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velos
      POSTGRES_USER: velos
      POSTGRES_PASSWORD: velos_tp_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velos -d velos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: velos-api:final
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://velos:velos_tp_2026@db:5432/velos
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
